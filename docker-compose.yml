services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prak18dashboard_app
    ports:
      - "5004:5004"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: prak18dashboard_nginx
    depends_on:
      - app
    ports:
      - "5003:5003"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
