server {
    listen 5004 ssl;
    server_name crossdaun.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/crossdaun.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crossdaun.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://app:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
